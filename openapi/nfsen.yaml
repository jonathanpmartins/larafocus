openapi: 3.0.3

info:
  title: FocusNFe API - NFSe Nacional (NFSen)
  description: |
    Endpoints para emissão, consulta, cancelamento e gerenciamento de
    Notas Fiscais de Serviço Eletrônicas no padrão Nacional (DPS/NFSe Nacional).
  version: 2.0.0
  contact:
    name: FocusNFe
    url: https://focusnfe.com.br

servers:
  - url: https://api.focusnfe.com.br/v2
    description: Produção
  - url: https://homologacao.focusnfe.com.br/v2
    description: Homologação (Sandbox)

security:
  - basicAuth: []

paths:
  /nfsen:
    post:
      operationId: enviarNfsen
      summary: Enviar DPS/NFSe Nacional para processamento
      description: |
        Envia uma DPS (Declaração de Prestação de Serviços) para processamento
        no padrão nacional de NFSe. Após a pré-validação, a nota entra em fila
        de processamento assíncrono.
      externalDocs:
        description: Documentação oficial
        url: https://doc.focusnfe.com.br/reference/enviardpsnacional
      parameters:
        - name: ref
          in: query
          required: true
          description: Referência única para o DPS/NFSe Nacional
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NfsenRequest'
            example:
              data_emissao: '2024-01-15T10:30:00-03:00'
              serie_dps: 1
              numero_dps: 100
              data_competencia: '2024-01-15'
              emitente_dps: '1'
              codigo_municipio_emissora: 3550308
              cnpj_prestador: '12345678000195'
              cnpj_tomador: '98765432000187'
              codigo_municipio_prestacao: '3550308'
              codigo_tributacao_nacional_iss: '010700'
              descricao_servico: Serviços de desenvolvimento de software
              valor_servico: 1500.00
      responses:
        '202':
          description: DPS aceita para processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NfsenProcessando'
              example:
                status: processando_autorizacao
                cnpj_prestador: '12345678000195'
                ref: REF-001
                protocolo: '123456789'
        '400':
          description: Erro de validação
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Não autorizado
        '422':
          description: Erro de processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /nfsen/{referencia}:
    get:
      operationId: consultarNfsen
      summary: Consultar NFSe Nacional por referência
      description: |
        Consulta o status de processamento de uma NFSe Nacional.
        Status possíveis: `processando_autorizacao`, `autorizado`, `negado`,
        `cancelado`, `erro_autorizacao`.
      externalDocs:
        description: Documentação oficial
        url: https://doc.focusnfe.com.br/reference/consultarnfsenacionalporreferencia
      parameters:
        - $ref: '#/components/parameters/referencia'
      responses:
        '200':
          description: Dados da NFSe Nacional conforme status
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NfsenProcessando'
                  - $ref: '#/components/schemas/NfsenAutorizada'
                  - $ref: '#/components/schemas/NfsenNegada'
                  - $ref: '#/components/schemas/NfsenCancelada'
                  - $ref: '#/components/schemas/NfsenErroAutorizacao'
                discriminator:
                  propertyName: status
                  mapping:
                    processando_autorizacao: '#/components/schemas/NfsenProcessando'
                    autorizado: '#/components/schemas/NfsenAutorizada'
                    negado: '#/components/schemas/NfsenNegada'
                    cancelado: '#/components/schemas/NfsenCancelada'
                    erro_autorizacao: '#/components/schemas/NfsenErroAutorizacao'
        '404':
          description: NFSe Nacional não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Não autorizado

    delete:
      operationId: cancelarNfsen
      summary: Cancelar NFSe Nacional
      description: |
        Cancela uma NFSe Nacional autorizada. **Ação permanente e irreversível.**
        Apenas notas com status `autorizado` podem ser canceladas.
      externalDocs:
        description: Documentação oficial
        url: https://doc.focusnfe.com.br/reference/cancelarnfsenacional
      parameters:
        - $ref: '#/components/parameters/referencia'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                justificativa:
                  type: string
                  description: |
                    Motivo do cancelamento. Obrigatório quando o código
                    de cancelamento é 4.
            example:
              justificativa: Cancelamento solicitado pelo tomador do serviço
      responses:
        '200':
          description: Resultado do cancelamento
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/NfsenCanceladaResponse'
                  - $ref: '#/components/schemas/NfsenErroCancelamento'
                discriminator:
                  propertyName: status
                  mapping:
                    cancelado: '#/components/schemas/NfsenCanceladaResponse'
                    erro_cancelamento: '#/components/schemas/NfsenErroCancelamento'
        '404':
          description: NFSe Nacional não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
        '401':
          description: Não autorizado

  /nfsen/{referencia}/hook:
    post:
      operationId: reenviarHookNfsen
      summary: Solicitar reenvio de notificação (webhook)
      description: |
        Solicita o reenvio das notificações via webhook para uma NFSe Nacional
        específica. Retorna a lista de webhooks que receberão a notificação.
      externalDocs:
        description: Documentação oficial
        url: https://doc.focusnfe.com.br/reference/reenviarhooknfsen
      parameters:
        - $ref: '#/components/parameters/referencia'
      responses:
        '200':
          description: Lista de webhooks notificados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookInfo'
              example:
                - id: Vj5rmkBq
                  url: http://minha.url/nfe
                  authorization: null
                  authorization_header: null
                  event: nfsen
                  cnpj: '12345678000123'
        '401':
          description: Não autorizado

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        Autenticação via HTTP Basic Auth.
        Token da API como usuário, senha em branco.

  parameters:
    referencia:
      name: referencia
      in: path
      required: true
      description: Referência única da NFSe Nacional
      schema:
        type: string

  schemas:
    NfsenRequest:
      type: object
      description: Dados da DPS (Declaração de Prestação de Serviços) no padrão nacional.
      required:
        - data_emissao
        - serie_dps
        - numero_dps
        - data_competencia
        - emitente_dps
        - codigo_municipio_emissora
        - cnpj_prestador
        - codigo_municipio_prestacao
        - codigo_tributacao_nacional_iss
        - descricao_servico
        - valor_servico
      properties:
        data_emissao:
          type: string
          format: date-time
          description: Data e hora da emissão da DPS (ISO 8601)
        serie_dps:
          type: integer
          description: Série da DPS
        numero_dps:
          type: integer
          description: Número da DPS
        data_competencia:
          type: string
          format: date
          description: Data de competência da prestação
        emitente_dps:
          type: string
          description: Emitente da DPS
        codigo_municipio_emissora:
          type: integer
          description: Código IBGE de 7 dígitos da localidade emissora
        cnpj_prestador:
          type: string
          description: CNPJ do prestador do serviço
        nif_prestador:
          type: string
          description: NIF fornecido por órgão de administração tributária
        codigo_opcao_simples_nacional:
          type: string
          description: Situação perante o Simples Nacional
        regime_especial_tributacao:
          type: string
          description: Regime Especial de Tributação Municipal
        cnpj_tomador:
          type: string
          description: CNPJ do tomador do serviço
        cpf_tomador:
          type: string
          description: CPF do tomador do serviço
        nif_tomador:
          type: string
          description: NIF do tomador
        motivo_ausencia_nif_tomador:
          type: string
          description: Motivo para não informação do NIF do tomador
        codigo_municipio_prestacao:
          type: string
          description: Código IBGE da localidade de prestação do serviço
        codigo_tributacao_nacional_iss:
          type: string
          description: Código de tributação nacional do ISSQN
        descricao_servico:
          type: string
          description: Descrição completa do serviço prestado
        valor_servico:
          type: number
          description: Valor monetário do serviço (R$)
        tributacao_iss:
          type: number
          description: Tributação do ISSQN sobre o serviço prestado

    NfsenProcessando:
      type: object
      description: NFSe Nacional em processamento
      properties:
        status:
          type: string
          enum: [processando_autorizacao]
          description: Status do processamento
        cnpj_prestador:
          type: string
          description: CNPJ do prestador do serviço
        ref:
          type: string
          description: Referência do DPS
        protocolo:
          type: string
          description: Protocolo de recebimento do DPS

    NfsenAutorizada:
      type: object
      description: NFSe Nacional autorizada
      properties:
        status:
          type: string
          enum: [autorizado]
        cnpj_prestador:
          type: string
        ref:
          type: string
        numero_rps:
          type: string
        serie_rps:
          type: string
        tipo_rps:
          type: string
        numero:
          type: string
          description: Número da NFSe emitida
        codigo_verificacao:
          type: string
          description: Código de verificação
        data_emissao:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: URL para visualização
        url_danfse:
          type: string
          format: uri
          description: URL do DANFSe (PDF)
        caminho_xml_nota_fiscal:
          type: string
          description: Caminho para download do XML

    NfsenCancelada:
      type: object
      description: NFSe Nacional cancelada
      properties:
        status:
          type: string
          enum: [cancelado]
        cnpj_prestador:
          type: string
        ref:
          type: string
        numero_rps:
          type: string
        serie_rps:
          type: string
        tipo_rps:
          type: string
        numero:
          type: string
        codigo_verificacao:
          type: string
        data_emissao:
          type: string
          format: date-time
        url:
          type: string
          format: uri
        caminho_xml_nota_fiscal:
          type: string
        url_danfse:
          type: string
          format: uri

    NfsenNegada:
      type: object
      description: NFSe Nacional negada
      properties:
        status:
          type: string
          enum: [negado]
        cnpj_prestador:
          type: string
        ref:
          type: string
        numero_rps:
          type: string
        serie_rps:
          type: string
        tipo_rps:
          type: string
        numero:
          type: string
          description: Número da NFSe emitida
        codigo_verificacao:
          type: string
          description: Código de verificação
        data_emissao:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: URL para visualização
        url_danfse:
          type: string
          format: uri
          description: URL do DANFSe (PDF)
        caminho_xml_nota_fiscal:
          type: string
          description: Caminho para download do XML

    NfsenErroAutorizacao:
      type: object
      description: NFSe Nacional com erro de autorização
      properties:
        status:
          type: string
          enum: [erro_autorizacao]
        cnpj_prestador:
          type: string
        ref:
          type: string
        numero_rps:
          type: string
        serie_rps:
          type: string
        tipo_rps:
          type: string
        erros:
          type: array
          items:
            $ref: '#/components/schemas/Erro'

    NfsenCanceladaResponse:
      type: object
      properties:
        status:
          type: string
          enum: [cancelado]

    NfsenErroCancelamento:
      type: object
      properties:
        status:
          type: string
          enum: [erro_cancelamento]
        erros:
          type: array
          items:
            $ref: '#/components/schemas/Erro'

    WebhookInfo:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        authorization:
          type: string
          nullable: true
        authorization_header:
          type: string
          nullable: true
        event:
          type: string
        cnpj:
          type: string
        cpf:
          type: string
          nullable: true

    Erro:
      type: object
      properties:
        codigo:
          type: string
          description: Código do erro
        mensagem:
          type: string
          description: Mensagem descritiva
        correcao:
          type: string
          nullable: true
          description: Sugestão de correção
